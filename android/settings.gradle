pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "Classeviva Expressive Native"

include ":app"
include ":core:core-domain"
include ":core:core-designsystem"
include ":core:core-database"
include ":core:core-datastore"
include ":core:core-network"
include ":core:core-data"
include ":core:core-assistant"
include ":feature:feature-dashboard"
include ":feature:feature-agenda"
include ":feature:feature-grades"
include ":feature:feature-lessons"
include ":feature:feature-communications"
include ":feature:feature-absences"
include ":feature:feature-settings"
include ":feature:feature-widgets"
include ":macrobenchmark"

// --- fluid-engine (inizio) ---
def engineDir = file('engine')
if (engineDir.exists()) {
  [
   'engine-foundation',
   'engine-ui',
   'engine-storage',
   'engine-net',
   'engine-config',
   'engine-update',
   'engine-widget',
   'engine-ai'
  ].each { name ->
    include ":$name"
    project(":$name").projectDir = new File(engineDir, name)
  }
}
