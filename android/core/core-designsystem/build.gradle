plugins {
  alias(libs.plugins.android.library)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.kotlin.compose)
}

android {
  namespace "dev.antigravity.classevivaexpressive.core.designsystem"
  compileSdk 36

  defaultConfig {
    minSdk 26
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // api e non implementation: i moduli feature dipendono da questo modulo e usano i componenti
  // dell'engine direttamente, quindi il design system deve arrivare fino a loro. Cosi' nessun
  // build.gradle delle feature cambia.
  api project(":engine-ui")
  implementation project(":core:core-domain")
  implementation platform(libs.compose.bom)
  implementation libs.bundles.compose
  implementation libs.kotlinx.coroutines.core

  testImplementation libs.junit4
  testImplementation libs.kotlinx.coroutines.test
}
